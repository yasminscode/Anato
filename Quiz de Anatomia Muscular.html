<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Anatomia Muscular</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6">

  <!-- Container Principal -->
  <div class="max-w-3xl w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col my-auto">
    
    <!-- Cabeçalho / Progresso -->
    <div class="bg-slate-800/80 backdrop-blur border-b border-slate-700 p-4 sm:p-5 flex justify-between items-center sticky top-0 z-10">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
          Quiz de Anatomia
        </h1>
        <p class="text-xs text-slate-400 mt-0.5">Estudo Prático em Modelos Anátomicos</p>
      </div>
      <span id="question-count" class="text-xs sm:text-sm font-semibold text-indigo-300 bg-indigo-950/80 border border-indigo-500/30 px-3 py-1.5 rounded-full">
        Questão 1 de 12
      </span>
    </div>

    <!-- Conteúdo do Quiz -->
    <div id="quiz-container" class="p-4 sm:p-6 flex-1 flex flex-col justify-between">
      
      <!-- Imagem do Modelo -->
      <div class="mb-5 bg-slate-950 rounded-xl border border-slate-700/60 p-2 sm:p-3 flex justify-center items-center max-h-[300px] sm:max-h-[380px] overflow-hidden relative group">
        <img id="quiz-image" src="" alt="Peça Anatômica" class="max-h-[280px] sm:max-h-[360px] w-auto object-contain rounded-lg transition-transform duration-300 group-hover:scale-105">
        <span id="image-badge" class="absolute bottom-3 left-3 bg-slate-900/90 text-slate-300 text-xs px-2.5 py-1 rounded-md border border-slate-700 font-mono">
          N° Identificador
        </span>
      </div>

      <!-- Pergunta -->
      <div class="mb-5">
        <h2 id="question-text" class="text-base sm:text-lg font-medium text-slate-200 leading-relaxed">
          <!-- Pergunta inserida via JS -->
        </h2>
      </div>

      <!-- Lista de Opções -->
      <div id="options-container" class="grid grid-cols-1 gap-2.5 sm:gap-3">
        <!-- Botões de opção gerados via JS -->
      </div>
    </div>

    <!-- Área de Feedback / Botão Próximo -->
    <div id="feedback-container" class="px-4 sm:px-6 pb-6 hidden flex-col">
      <div id="feedback-message" class="p-3.5 rounded-xl text-sm font-semibold mb-3 border">
        <!-- Mensagem de acerto/erro -->
      </div>
      <button id="next-btn" onclick="nextQuestion()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200 flex items-center justify-center gap-2">
        <span>Próxima Pergunta</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>

    <!-- Tela de Resultado Final (Inicia oculta) -->
    <div id="score-container" class="hidden text-center p-8 sm:p-12 my-auto">
      <div class="inline-flex p-4 rounded-full bg-indigo-950/80 border border-indigo-500/30 mb-4 text-indigo-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h2 class="text-2xl sm:text-3xl font-bold text-white mb-2">Quiz Finalizado!</h2>
      <p class="text-slate-400 text-sm sm:text-base mb-6">Confira abaixo o seu desempenho no teste anatômico:</p>
      
      <div class="bg-slate-900 border border-slate-700/80 rounded-2xl p-6 max-w-sm mx-auto mb-8">
        <div class="text-4xl sm:text-5xl font-extrabold text-indigo-400 mb-1" id="final-score">0 / 0</div>
        <div class="text-xs text-slate-500 font-medium uppercase tracking-wider">Aproveitamento</div>
      </div>

      <button onclick="restartQuiz()" class="px-8 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200">
        Refazer Quiz
      </button>
    </div>

  </div>

  <script>
    // Mapeamento das Imagens enviadas
    // As fotos 4 e 5 compartilham a mesma peça anatômica (24179.png)
    const images = {
      1: "24176.png",
      2: "24177.jpg",
      3: "24178.png",
      4: "24179.png",
      5: "24179.png",
      6: "24180.png",
      7: "24181.jpg"
    };

    // Banco de Perguntas
    // Regra: Em todas as opções de cada pergunta, mantemos O MESMO NOME DO MÚSCULO/ESTRUTURA, 
    // alterando apenas a propriedade anatômica em questão!
    const questionsData = [
      // --- 1. Músculo Deltoide (Foto 1) ---
      {
        imgNum: 1,
        question: "Na peça anatômica indicada pelo **número 1**, qual é a **ORIGEM** do Músculo Deltoide?",
        options: [
          "Músculo Deltoide — Origem: Clavícula, acrômio e espinha da escápula",
          "Músculo Deltoide — Origem: Costelas de I a IX",
          "Músculo Deltoide — Origem: Linha nucal e processos espinhosos",
          "Músculo Deltoide — Origem: Vértebras toracolombares, sacro e crista ilíaca"
        ],
        answer: 0
      },
      {
        imgNum: 1,
        question: "Na peça anatômica indicada pelo **número 1**, qual é a **FUNÇÃO** do Músculo Deltoide?",
        options: [
          "Músculo Deltoide — Função: Movimenta o braço para frente, lado e atrás (flexão, abdução e extensão)",
          "Músculo Deltoide — Função: Movimentação escapular (protração e rotação superior)",
          "Músculo Deltoide — Função: Eleva o esterno e as costelas superiores e deprime a escápula",
          "Músculo Deltoide — Função: Adução, rotação medial e retroversão do braço"
        ],
        answer: 0
      },

      // --- 2. Músculo Serrátil Anterior (Foto 2) ---
      {
        imgNum: 2,
        question: "Na peça anatômica indicada pelo **número 2**, qual é a **INERVAÇÃO** do Músculo Serrátil Anterior?",
        options: [
          "Músculo Serrátil Anterior — Inervação: Nervo axilar",
          "Músculo Serrátil Anterior — Inervação: Nervo torácico longo",
          "Músculo Serrátil Anterior — Inervação: Nervos peitorais mediais e laterais",
          "Músculo Serrátil Anterior — Inervação: Nervo acessório"
        ],
        answer: 1
      },
      {
        imgNum: 2,
        question: "Na peça anatômica indicada pelo **número 2**, qual é a **INSERÇÃO** do Músculo Serrátil Anterior?",
        options: [
          "Músculo Serrátil Anterior — Inserção: Escápula (margem medial)",
          "Músculo Serrátil Anterior — Inserção: Úmero (tuberosidade deltoideia)",
          "Músculo Serrátil Anterior — Inserção: Escápula (processo coracoide)",
          "Músculo Serrátil Anterior — Inserção: Clavícula, acrômio e espinha da escápula"
        ],
        answer: 0
      },

      // --- 3. Músculo Peitoral Menor (Foto 3) ---
      {
        imgNum: 3,
        question: "Na peça anatômica indicada pelo **número 3**, qual é a **ORIGEM** do Músculo Peitoral Menor?",
        options: [
          "Músculo Peitoral Menor — Origem: Costelas de III a V",
          "Músculo Peitoral Menor — Origem: Costelas de I a IX",
          "Músculo Peitoral Menor — Origem: Linha nucal e processos espinhosos",
          "Músculo Peitoral Menor — Origem: Clavícula, acrômio e espinha da escápula"
        ],
        answer: 0
      },
      {
        imgNum: 3,
        question: "Na peça anatômica indicada pelo **número 3**, qual é a **FUNÇÃO** do Músculo Peitoral Menor?",
        options: [
          "Músculo Peitoral Menor — Função: Eleva o esterno e as costelas superiores e deprime/conduz a escápula para a frente",
          "Músculo Peitoral Menor — Função: Eleva, puxa e abaixa a escápula",
          "Músculo Peitoral Menor — Função: Adução, rotação medial e retroversão do braço",
          "Músculo Peitoral Menor — Função: Movimenta o braço para frente, lado e atrás"
        ],
        answer: 0
      },

      // --- 4. Músculo Trapézio (Foto 4/5) ---
      {
        imgNum: 4,
        question: "Na peça anatômica que contém os números 4 e 5, qual é a **INERVAÇÃO** do Músculo Trapézio (**número 4**)?",
        options: [
          "Músculo Trapézio — Inervação: Nervo toracodorsal",
          "Músculo Trapézio — Inervação: Nervo acessório",
          "Músculo Trapézio — Inervação: Nervo axilar",
          "Músculo Trapézio — Inervação: Nervo torácico longo"
        ],
        answer: 1
      },
      {
        imgNum: 4,
        question: "Na peça anatômica que contém os números 4 e 5, qual é a **INSERÇÃO** do Músculo Trapézio (**número 4**)?",
        options: [
          "Músculo Trapézio — Inserção: Clavícula, acrômio e espinha da escápula",
          "Músculo Trapézio — Inserção: Úmero",
          "Músculo Trapézio — Inserção: Escápula (margem medial)",
          "Músculo Trapézio — Inserção: Escápula (processo coracoide)"
        ],
        answer: 0
      },

      // --- 5. Latíssimo do Dorso (Foto 4/5) ---
      {
        imgNum: 5,
        question: "Na peça anatômica que contém os números 4 e 5, qual é a **ORIGEM** do Latíssimo do Dorso (**número 5**)?",
        options: [
          "Latíssimo do Dorso — Origem: Vértebras toracolombares, sacro e crista ilíaca",
          "Latíssimo do Dorso — Origem: Linha nucal e processos espinhosos",
          "Latíssimo do Dorso — Origem: Costelas de III a V",
          "Latíssimo do Dorso — Origem: Costelas de I a IX"
        ],
        answer: 0
      },
      {
        imgNum: 5,
        question: "Na peça anatômica que contém os números 4 e 5, qual é a **INERVAÇÃO** do Latíssimo do Dorso (**número 5**)?",
        options: [
          "Latíssimo do Dorso — Inervação: Nervo toracodorsal",
          "Latíssimo do Dorso — Inervação: Nervo acessório",
          "Latíssimo do Dorso — Inervação: Nervo axilar",
          "Latíssimo do Dorso — Inervação: Nervos peitorais mediais e laterais"
        ],
        answer: 0
      },

      // --- 6. Manguito Rotador (Foto 6) ---
      {
        imgNum: 6,
        question: "Qual grupo muscular ou estrutura anatômica está indicado pelo **número 6** no modelo ósseo?",
        options: [
          "Manguito Rotador",
          "Plexo Braquial",
          "Músculo Deltoide",
          "Músculo Trapézio"
        ],
        answer: 0
      },

      // --- 7. Plexo Braquial (Foto 7) ---
      {
        imgNum: 7,
        question: "Qual estrutura anatômica nervosa está identificada pelo **número 7** no manequim?",
        options: [
          "Plexo Braquial",
          "Manguito Rotador",
          "Nervo Torácico Longo",
          "Nervo Acessório"
        ],
        answer: 0
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let selectedOption = null;

    function loadQuestion() {
      selectedOption = null;
      document.getElementById("feedback-container").classList.add("hidden");
      document.getElementById("feedback-container").classList.remove("flex");

      const q = questionsData[currentQuestionIndex];

      document.getElementById("question-count").innerText = `Questão ${currentQuestionIndex + 1} de ${questionsData.length}`;
      document.getElementById("quiz-image").src = images[q.imgNum];
      document.getElementById("image-badge").innerText = `Foto do N° ${q.imgNum === 4 || q.imgNum === 5 ? '4 e 5' : q.imgNum}`;
      document.getElementById("question-text").innerHTML = formatBoldText(q.question);

      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-3.5 sm:p-4 rounded-xl border border-slate-700 bg-slate-900 hover:bg-slate-800 hover:border-slate-600 transition duration-150 font-normal text-xs sm:text-sm text-slate-200 flex justify-between items-center group";
        btn.innerHTML = `<span>${formatBoldText(opt)}</span>`;
        btn.onclick = () => selectOption(idx, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function formatBoldText(text) {
      return text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-indigo-300 font-semibold">$1</strong>');
    }

    function selectOption(index, btnElement) {
      if (selectedOption !== null) return;

      selectedOption = index;
      const q = questionsData[currentQuestionIndex];
      const isCorrect = index === q.answer;

      if (isCorrect) score++;

      const options = document.getElementById("options-container").children;
      for (let i = 0; i < options.length; i++) {
        options[i].disabled = true;
        if (i === q.answer) {
          options[i].className = "w-full text-left p-3.5 sm:p-4 rounded-xl border-2 border-emerald-500 bg-emerald-950/40 text-emerald-200 font-medium text-xs sm:text-sm";
        } else if (i === index) {
          options[i].className = "w-full text-left p-3.5 sm:p-4 rounded-xl border-2 border-rose-500 bg-rose-950/40 text-rose-200 font-medium text-xs sm:text-sm";
        } else {
          options[i].className = "w-full text-left p-3.5 sm:p-4 rounded-xl border border-slate-800 bg-slate-900/50 text-slate-500 text-xs sm:text-sm opacity-60";
        }
      }

      const feedbackContainer = document.getElementById("feedback-container");
      const feedbackMsg = document.getElementById("feedback-message");

      feedbackContainer.classList.remove("hidden");
      feedbackContainer.classList.add("flex");

      if (isCorrect) {
        feedbackMsg.className = "p-3.5 rounded-xl text-xs sm:text-sm font-semibold mb-3 bg-emerald-950/80 border border-emerald-500/50 text-emerald-300";
        feedbackMsg.innerText = "✓ Resposta Correta!";
      } else {
        feedbackMsg.className = "p-3.5 rounded-xl text-xs sm:text-sm font-semibold mb-3 bg-rose-950/80 border border-rose-500/50 text-rose-300";
        feedbackMsg.innerText = `✕ Incorreto. A opção correta é: ${q.options[q.answer]}`;
      }
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questionsData.length) {
        loadQuestion();
      } else {
        showScore();
      }
    }

    function showScore() {
      document.getElementById("quiz-container").classList.add("hidden");
      document.getElementById("feedback-container").classList.add("hidden");
      document.getElementById("score-container").classList.remove("hidden");

      document.getElementById("final-score").innerText = `${score} / ${questionsData.length}`;
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      document.getElementById("score-container").classList.add("hidden");
      document.getElementById("quiz-container").classList.remove("hidden");
      loadQuestion();
    }

    // Inicialização
    window.onload = function () {
      loadQuestion();
    }
  </script>
</body>
</html>
